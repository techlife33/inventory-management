name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and leave your findings as a PR comment.
            Focus on correctness bugs, missing test coverage, and deviations
            from the conventions in CLAUDE.md. Be concise and specific: cite
            file and line, and skip praise.
          claude_args: '--allowed-tools "mcp__github_comment__update_claude_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"'
